name: Deploy Referrals





on:
  workflow_dispatch:

  push:
    branches:
      - wellington


permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH

        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy

        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'

          set -euxo pipefail

          cd ~/apps/referrals

          git fetch origin

          git reset --hard origin/wellington

          docker compose down

          docker compose up -d --build

          docker image prune -f

          EOF