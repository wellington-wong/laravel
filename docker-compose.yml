services:
  app:
    build:

      context: .
      dockerfile: Dockerfile

    container_name: referrals-app

    restart: unless-stopped

    ports:
      - "8081:80"

    env_file:
      - .env

    volumes:
      - ./storage:/var/www/html/storage

  db:
    image: mariadb:10.6

    restart: unless-stopped

    environment:

      MARIADB_DATABASE: referrals
      MARIADB_USER: referrals
      MARIADB_PASSWORD: referrals

      MARIADB_ROOT_PASSWORD: rootpassword

    volumes:
      - mariadb_data:/var/lib/mysql



volumes:
  mariadb_data: