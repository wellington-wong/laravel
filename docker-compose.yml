services:
  app:
    build:

      context: .
      dockerfile: Dockerfile

    container_name: referrals-app

    restart: unless-stopped

    ports:
      - "8081:80"

    env_file:
      - .env

    volumes:
      - storage:/var/www/html/storage

    extra_hosts:
      - "host.docker.internal:host-gateway"




volumes:
  storage: